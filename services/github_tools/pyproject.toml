[project]
name = "patchapi-github-tools"
version = "0.1.0"
description = "Narrow GitHub App capability adapter: agents receive capabilities, never tokens."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # RS256 signing for the GitHub App JWT. Already a transitive dependency of
    # the workspace; named here because this tree calls it directly.
    "cryptography>=43,<51",
    "fastapi>=0.115,<0.130",
    "httpx>=0.27,<0.29",
    "patchapi-github",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<0.40",
]

[project.scripts]
patchapi-github-tools = "patchapi_github_tools.__main__:main"

[tool.uv.sources]
patchapi-github = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchapi_github_tools"]
