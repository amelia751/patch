[project]
name = "patchapi-repo-indexer"
version = "0.1.0"
description = "Deterministic API usage indexer — Layer A inventory builder for a local checkout."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "patchapi-repo-scan",
    "patchapi-schemas",
    "patchapi-events",
    "patchapi-providers",
    "patchapi-state",
    "pydantic>=2.9,<3",
    "asyncpg>=0.30,<0.31",
    "httpx>=0.27,<0.29",
    "google-cloud-pubsub>=2.27,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<0.40",
    "cryptography>=43,<46",
]

[project.scripts]
patchapi-repo-indexer = "patchapi_repo_indexer.__main__:main"
patchapi-repo-indexer-worker = "patchapi_repo_indexer.pubsub:main"
patchapi-repo-indexer-serve = "patchapi_repo_indexer.serve:main"

[tool.uv.sources]
patchapi-repo-scan = { workspace = true }
patchapi-schemas = { workspace = true }
patchapi-events = { workspace = true }
patchapi-providers = { workspace = true }
patchapi-state = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchapi_repo_indexer"]
