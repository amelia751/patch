[project]
name = "patchapi-state"
version = "0.1.0"
description = "Read-only access to PatchAPI's authoritative workflow state in Postgres."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# asyncpg rather than a sync driver: the control plane is ASGI, and a blocking
# read would stall the event loop that serves every other request.
dependencies = [
    "asyncpg>=0.30,<0.31",
    "patchapi-auth",
    "patchapi-control-api",
    "patchapi-events",
    "patchapi-schemas",
    "uvicorn>=0.30,<0.40",
]

# The wired control plane. `patchapi-control-api` remains the unwired service;
# this entry point is the composition root that connects it to Postgres.
[project.scripts]
patchapi-serve = "packages.state.serve:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
]

[tool.uv.sources]
patchapi-events = { workspace = true }
patchapi-schemas = { workspace = true }
patchapi-control-api = { workspace = true }
patchapi-auth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat modules, matching the other `packages/` members: the in-tree checkout is
# itself `packages.state`, so a `src/` layout would be shadowed by this
# directory once the repo root is on `sys.path`. The wheel re-adds the prefix,
# and every module is listed so a new file cannot ship unnoticed.
[tool.hatch.build.targets.wheel]
only-include = ["__init__.py"]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "packages/state/__init__.py"
"auth_routes.py" = "packages/state/auth_routes.py"
"config.py" = "packages/state/config.py"
"dashboard.py" = "packages/state/dashboard.py"
"pool.py" = "packages/state/pool.py"
"runs.py" = "packages/state/runs.py"
"serve.py" = "packages/state/serve.py"
"session.py" = "packages/state/session.py"
"users.py" = "packages/state/users.py"
"github_routes.py" = "packages/state/github_routes.py"
"projects.py" = "packages/state/projects.py"
"project_routes.py" = "packages/state/project_routes.py"
"notifications.py" = "packages/state/notifications.py"
"notification_routes.py" = "packages/state/notification_routes.py"
"codebase.py" = "packages/state/codebase.py"
"indexing.py" = "packages/state/indexing.py"
"console_events.py" = "packages/state/console_events.py"
"gcp_catalog.py" = "packages/state/gcp_catalog.py"
"google_models.py" = "packages/state/google_models.py"
"provider_routes.py" = "packages/state/provider_routes.py"
"data/google_services.json" = "packages/state/data/google_services.json"
"data/google_models.json" = "packages/state/data/google_models.json"
