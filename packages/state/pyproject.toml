[project]
name = "patchapi-state"
version = "0.1.0"
description = "Read-only access to PatchAPI's authoritative workflow state in Postgres."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# asyncpg rather than a sync driver: the control plane is ASGI, and a blocking
# read would stall the event loop that serves every other request.
dependencies = [
    "asyncpg>=0.30,<0.31",
    "google-cloud-secret-manager>=2.20,<3",
    "patchapi-auth",
    "patchapi-control-api",
    "patchapi-events",
    # The live model check: findings escalate on what a surface publishes now,
    # not on a date typed into the watchlist.
    "patchapi-providers",
    "patchapi-schemas",
    "uvicorn>=0.30,<0.40",
]

# The wired control plane. `patchapi-control-api` remains the unwired service;
# this entry point is the composition root that connects it to Postgres.
# `patchapi-refresh-releases` is the scheduled batch half: same image, no
# server, run to completion by Cloud Scheduler.
[project.scripts]
patchapi-serve = "packages.state.serve:main"
patchapi-refresh-releases = "packages.state.refresh:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
]

[tool.uv.sources]
patchapi-events = { workspace = true }
patchapi-schemas = { workspace = true }
patchapi-control-api = { workspace = true }
patchapi-auth = { workspace = true }
patchapi-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat modules, matching the other `packages/` members: the in-tree checkout is
# itself `packages.state`, so a `src/` layout would be shadowed by this
# directory once the repo root is on `sys.path`. The wheel re-adds the prefix,
# and every module is listed so a new file cannot ship unnoticed.
[tool.hatch.build.targets.wheel]
only-include = ["__init__.py"]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "packages/state/__init__.py"
"auth_routes.py" = "packages/state/auth_routes.py"
"config.py" = "packages/state/config.py"
"corpus.py" = "packages/state/corpus.py"
