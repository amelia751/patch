[project]
name = "patchapi-memory"
version = "0.1.0"
description = "Memory Bank client interface and a local file-backed fake for offline runs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Standard library only. The Google Agent Platform SDK belongs to the adapter
# that implements this interface against a real Memory Bank, not to the
# interface itself — tests and offline runs must not need credentials.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py"]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "packages/memory/__init__.py"
"client.py" = "packages/memory/client.py"
"local.py" = "packages/memory/local.py"
"profile.py" = "packages/memory/profile.py"
