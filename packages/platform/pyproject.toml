[project]
name = "patchapi-platform"
version = "0.1.0"
description = "Google Agent Registry client for publishing and reading the PatchAPI fleet catalog."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Credentials only. The transport is `urllib` behind an injectable callable, so
# there is no generated client to keep in step with the API and tests need no
# network. `google-auth` is the one thing that cannot be reimplemented safely.
dependencies = [
    "google-auth>=2.35,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py"]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "packages/platform/__init__.py"
"config.py" = "packages/platform/config.py"
"registry.py" = "packages/platform/registry.py"
