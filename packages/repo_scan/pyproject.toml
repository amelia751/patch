[project]
name = "patchapi-repo-scan"
version = "0.1.0"
description = "Deterministic API-usage scanning helpers — the non-LLM Layer A of impact analysis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Standard library only. This layer must produce the same inventory on every
# run, so it has no model in it and nothing that could vary between machines.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py"]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "packages/repo_scan/__init__.py"
"classify.py" = "packages/repo_scan/classify.py"
"config.py" = "packages/repo_scan/config.py"
"scan.py" = "packages/repo_scan/scan.py"
