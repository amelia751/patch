# Deploy Storygen to the reserved Cloud Run name on every push to main.
# Service name is the URL: do not rename `storygen`.
#
# Auth is the artful-journey development key, stored as repo secret GCP_SA_KEY
# (contents of artful-journey-486915-a8-fc72d9d68c0b.json). Runtime identity
# stays jetrun-viewer@ so GEMINI_API_KEY can be the Secret Manager ref.
name: Deploy Cloud Run on every update to main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_ID: artful-journey-486915-a8
  PROJECT_NUMBER: "1005432364863"
  REGION: us-central1
  SERVICE: storygen
  RUNTIME_SA: jetrun-viewer@artful-journey-486915-a8.iam.gserviceaccount.com
  SECRET_NAME: storygen-gemini-api-key
  STABLE_URL: https://storygen-1005432364863.us-central1.run.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --source=. \
            --allow-unauthenticated \
            --service-account="${RUNTIME_SA}" \
            --set-secrets="GEMINI_API_KEY=${SECRET_NAME}:latest" \
            --port=8080 \
            --quiet
          printf 'STABLE_URL=%s\n' "${STABLE_URL}"
