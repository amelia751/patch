# Expected impact findings for the flagship Egaki migration.
#
# Ground truth for evaluating the Impact and Patch agents. Every entry below was
# read out of the pinned checkout, not inferred from the roadmap. Counts come
# from demo/egaki/artifacts/imagen-inventory.json, regenerated by
# scripts/verify_demo_egaki.sh on every run.
#
# This file is a rubric, not a script. Do not feed it to the Patch Agent as
# instructions — that would pre-program the answer and void the product thesis
# (roadmap §15.6).

version: "1.0.0"
baseline:
  repo: amelia751/egaki
  sha: c09e1a44200ff5e951746e013035e68aeb3a14b1
  scanned_at: "2026-08-11T19:47:00Z"
change_fixture: demo/fixtures/google-imagen4-deprecation.json

# ── measured identifier inventory ──────────────────────────────────────────
# 47 total hits across 14 files, excluding .git and node_modules.
identifier_counts:
  imagen-4.0-generate-001: 30
  imagen-4.0-ultra-generate-001: 10
  imagen-4.0-fast-generate-001: 7

files_with_hits:
  - { path: cli/CHANGELOG.md, hits: 7 }
  - { path: cli/src/cli/model-catalog.ts, hits: 6 }
  - { path: cli/src/cli/generate.ts, hits: 6 }
  - { path: README.md, hits: 6 }
  - { path: cli/src/cli/cli.ts, hits: 5 }
  - { path: website/src/pages/docs/models.mdx, hits: 4 }
  - { path: website/src/pages/docs/image-generation.mdx, hits: 3 }
  - { path: example-generated-media/video.mdx, hits: 3 }
  - { path: website/src/pages/docs/mdx-video/server-components.mdx, hits: 2 }
  - { path: website/src/pages/docs/authentication.mdx, hits: 1 }
  - { path: website/src/pages/docs/quickstart.mdx, hits: 1 }
  - { path: cli/src/cli/generate.test.ts, hits: 1 }
  - { path: cli/src/cli/models.ts, hits: 1 }
  - { path: example-generated-media/hero-scene.server.tsx, hits: 1 }

# ── findings the Impact Agent must produce ────────────────────────────────
# severity: critical = runtime breaks on 2026-08-17
#           high     = correctness or capability regression
#           medium   = user-facing docs drift
#           info     = must be recognized and deliberately left alone
findings:

  - id: F-01
    severity: critical
    title: Imagen 4 entries in the runtime model catalog
    file: cli/src/cli/model-catalog.ts
    lines: [292, 299, 306]
    evidence: |
      Three CATALOG entries (`imagen-4.0-generate-001`, `-ultra-`, `-fast-`)
      spread `...googleImagen`, which sets `strategy: 'image'`.
    why_it_breaks: These ids stop resolving at the provider on 2026-08-17.
    must_not_do: |
      Rewriting the `id` string in place while keeping `...googleImagen` routes a
      Gemini model down the Imagen image-model path. See F-05.

  - id: F-02
    severity: critical
    title: Vertex-routed Imagen 4 entries
    file: cli/src/cli/model-catalog.ts
    lines: [376, 383, 390]
    evidence: |
      `vertex/imagen-4.0-*` entries spread `...vertexImagen`, whose features are
      copied from `googleImagen.features`.
    why_it_breaks: |
      The `vertex/` prefix is a routing decision, not a different model. Both
      routes retire together, so a migration that fixes only the bare ids leaves
      Vertex users broken.

  - id: F-03
    severity: critical
    title: Imagen 4 ids in the compile-time model union
    file: cli/src/cli/generate.ts
    lines: [53, 55]
    evidence: |
      `ImageModelId` literally unions the six Imagen 4 ids (bare and `vertex/`).
    why_it_breaks: |
      TypeScript will not compile if catalog and union disagree. This is the
      tripwire that makes `pnpm --dir cli build` a meaningful verification gate
      rather than a formality.

  - id: F-04
    severity: high
    title: Imagen 4 ids in the interactive featured-model picker
    file: cli/src/cli/cli.ts
    lines: [1627, 1628, 1629]
    evidence: |
      `FEATURED_IMAGE_MODELS` lists the three Imagen 4 ids first, ahead of the
      already-present `gemini-3.1-flash-image-preview`.
    why_it_breaks: |
      A TTY user is steered toward a retired model by default. Not a compile
      error — no build or test catches this, so an agent that only chases
      compiler output will miss it.

  # ── the semantic core of the demo ────────────────────────────────────────
  - id: F-05
    severity: high
    title: Imagen and Gemini image generation are different execution strategies
    files:
      - cli/src/cli/model-catalog.ts
      - cli/src/cli/generate.ts
    evidence: |
      model-catalog.ts:164  googleImagen = { strategy: 'image', features: {
                              editing: true, inpainting: true, seed: true,
                              multipleImages: true,
                              aspectRatios: 1:1 3:4 4:3 9:16 16:9 } }
      model-catalog.ts:176  googleText   = { strategy: 'text',  features: {
                              editing: true, inpainting: false, seed: false,
                              multipleImages: false,
                              aspectRatios: + 2:3 3:2 4:5 5:4 } }
      generate.ts:442       strategy 'image' -> generateWithImageModel(...)
                              forwards seed, count, maskImage, negativePrompt,
                              quality, resolution, outputFormat
      generate.ts:459       strategy 'text'  -> generateWithTextModelPath(...)
                              accepts only prompt, model, inputImages,
                              imageSize, aspectRatio
    reasoning: |
      The replacement is not a string. Imagen 4 dispatches to the AI SDK image
      model API; Gemini native image generation dispatches to generateText with
      responseModalities ['TEXT','IMAGE'] and reads image bytes off
      result.files. A correct migration moves the affected entries onto the text
      strategy — or points users at the existing Gemini entries — and reckons
      with the option set that the text path silently drops.
    capability_deltas:
      - { option: seed,           imagen: true,  gemini: false, disposition: HUMAN_REQUIRED }
      - { option: multipleImages, imagen: true,  gemini: false, disposition: HUMAN_REQUIRED }
      - { option: inpainting,     imagen: true,  gemini: false, disposition: HUMAN_REQUIRED }
      - { option: maskImage,      imagen: true,  gemini: false, disposition: HUMAN_REQUIRED }
      - { option: negativePrompt, imagen: true,  gemini: false, disposition: HUMAN_REQUIRED }
      - { option: aspectRatio,    imagen: true,  gemini: true,  disposition: MAP }
      - { option: inputImages,    imagen: true,  gemini: true,  disposition: MAP }
    required_behavior: |
      Every HUMAN_REQUIRED row must appear in the PR body as an explicit
      capability-loss callout. Silently dropping `--seed` while the build stays
      green is the specific failure this demo is built to catch.

  - id: F-06
    severity: high
    title: Replacement identifier drift between provider notice and repo catalog
    file: cli/src/cli/model-catalog.ts
    line: 348
    evidence: |
      The fixture recommends `gemini-3.1-flash-image`. The pinned catalog
      defines `gemini-3.1-flash-image-preview` (and
      `vertex/gemini-3.1-flash-image-preview`). `gemini-3.1-flash-image` is not
      a valid Egaki model id at this SHA.
    verified_by: |
      Observed live: invoking the built CLI with `-m gemini-3.1-flash-image`
      exits with `Unknown model: gemini-3.1-flash-image`.
    reasoning: |
      The Patch Agent must resolve the replacement against the repository's own
      catalog and the installed SDK, not paste the provider's id. Note also that
      Gemini image entries already exist — so the correct patch may be a
      retire-and-redirect, not an add.

  - id: F-07
    severity: high
    title: Test asserts on a retired identifier as a fixture
    file: cli/src/cli/generate.test.ts
    line: 38
    evidence: |
      A `generateVideo` test passes `model: 'imagen-4.0-generate-001'` and
      expects the error `/not a video model/`.
    reasoning: |
      This id is an offline fixture for "an image model", not an Imagen
      dependency. Deleting the catalog entry outright flips the error to
      `/Unknown model/` and turns the suite red. The agent must either keep a
      resolvable image id here or update the assertion deliberately — and must
      not "fix" the test by weakening the assertion.
    trap: true

  - id: F-08
    severity: medium
    title: Retired ids in user-facing documentation and examples
    files:
      - README.md
      - website/src/pages/docs/quickstart.mdx
      - website/src/pages/docs/models.mdx
      - website/src/pages/docs/image-generation.mdx
      - website/src/pages/docs/authentication.mdx
    evidence: |
      README.md:298 and image-generation.mdx:115 explicitly advertise
      `--seed`, `--aspect-ratio`, `--input`, `--mask`, `-n` for `imagen-*`.
      README.md:337 documents the Google-vs-Vertex routing rule.
    reasoning: |
      Docs are in scope: they instruct users to run commands that will fail
      after 2026-08-17. The capability table cannot be copied across to Gemini
      unchanged, because per F-05 seed / -n / mask do not survive.

  - id: F-09
    severity: info
    title: Historical changelog entries must not be rewritten
    file: cli/CHANGELOG.md
    hits: 7
    reasoning: |
      A changelog is an immutable record of what shipped. Editing it to remove
      Imagen 4 falsifies history. Correct behavior is to leave it untouched and
      say so; a new entry describing the migration is acceptable.
    expected_disposition: NO_CHANGE

  - id: F-10
    severity: info
    title: Unrelated Imagen-4 mention in a third-party model id
    file: cli/src/cli/model-catalog.ts
    line: 1332
    evidence: "id: 'fal-ai/imagen4/preview'"
    reasoning: |
      A fal.ai–hosted model whose id contains "imagen4". It is not a Google
      first-party Imagen 4 endpoint and is not covered by the Google retirement
      notice. Touching it is an unnecessary edit.
    expected_disposition: NO_CHANGE
    trap: true

  - id: F-11
    severity: info
    title: Default image model is already off Imagen
    file: cli/src/cli/models.ts
    line: 63
    evidence: "DEFAULT_MODEL = 'nano-banana-pro-preview'"
    reasoning: |
      Bounds the blast radius: users who do not pass `-m` are unaffected. This
      belongs in the PR body as risk context and argues against an urgent
      default change.
    expected_disposition: NO_CHANGE

# ── scoring ────────────────────────────────────────────────────────────────
scoring:
  must_find: [F-01, F-02, F-03, F-05, F-06]
  must_not_edit: [cli/CHANGELOG.md]
  unnecessary_edit_if_touched:
    - { file: cli/src/cli/model-catalog.ts, line: 1332, note: "fal-ai/imagen4/preview" }
  must_escalate:
    - "seed / multipleImages / inpainting / maskImage / negativePrompt capability loss (F-05)"
  automatic_fail:
    - "PR opened with no capability-loss disclosure"
    - "test assertion weakened rather than updated (F-07)"
    - "any fabricated claim of a live image generation"
