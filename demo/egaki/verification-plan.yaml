# Verification plan for the pinned Egaki migration (roadmap §15.7).
#
# The Verification Agent is independent of the Patch Agent (CLAUDE.md §6) and
# grades against this plan. Every command below was executed against the pinned
# SHA before this file was written; the recorded outcomes are baseline truth,
# not predictions.

version: "1.0.0"
baseline:
  repo: amelia751/egaki
  sha: c09e1a44200ff5e951746e013035e68aeb3a14b1
  package_manager: pnpm
  pnpm_version_observed: "10.15.0"
  node_version_observed: "v22.16.0"

isolation:
  required: true
  phase_1: local temp workspace
  phase_2_plus: GKE Agent Sandbox
  rule: |
    A patch that has only been applied to demo/egaki/checkout/ is not verified.
    The checkout is a read-only baseline reference; it is never the workspace a
    patch is graded in.

# ── gates ──────────────────────────────────────────────────────────────────
# blocking: true  -> failure means no PR, full stop.
gates:

  - id: G-01
    name: baseline integrity
    blocking: true
    command: git rev-parse HEAD
    expect: c09e1a44200ff5e951746e013035e68aeb3a14b1
    baseline_result: PASS
    rationale: |
      If the checkout drifts off the pin, every downstream result describes a
      different repository than the one the evidence claims.

  - id: G-02
    name: exposure present at baseline
    blocking: true
    command: rg -F imagen-4.0-generate-001 (excluding .git, node_modules)
    expect: ">= 1 hit"
    baseline_result: "PASS — 30 hits, 14 files, 47 hits across all three ids"
    rationale: |
      Guards against a silently-fixed upstream. If the exposure is gone the demo
      no longer demonstrates anything and must fail loudly, not proceed.

  - id: G-03
    name: dependency install
    blocking: true
    command: pnpm install --frozen-lockfile
    baseline_result: |
      PASS in 19.8s. Emits ~24 benign ENOENT warnings ("Failed to create bin at
      .../node_modules/.bin/egaki") because the workspace self-links the CLI
      before it is built. These are expected at baseline and must not be treated
      as a patch-induced regression.
    network: dependency-install phase only (roadmap §13.3)

  - id: G-04
    name: typecheck and build
    blocking: true
    command: pnpm --dir cli build      # tsc && chmod +x dist/cli/main.js
    baseline_result: PASS
    rationale: |
      The `ImageModelId` union in generate.ts:53-56 hardcodes the Imagen 4 ids,
      so tsc genuinely fails if the catalog and the union disagree. This gate has
      teeth.

  - id: G-05
    name: unit tests
    blocking: true
    command: pnpm --dir cli test       # vitest run
    baseline_result: "PASS — 14 files, 444 tests, ~3.8s"
    regression_rule: |
      444 passing is the floor. Fewer passing tests, or any skipped test that
      was not skipped at baseline, is a FAIL — including a test "fixed" by
      weakening its assertion (expected-findings.yaml F-07).

  - id: G-06
    name: no retired identifier on the exercised path
    blocking: true
    check: |
      After the patch, none of the three Imagen 4 ids may appear in
      cli/src/**, excluding test fixtures explicitly justified in the PR body.
      cli/CHANGELOG.md is excluded by design (F-09).
    baseline_result: "N/A — baseline is expected to be dirty; this gate applies post-patch only"

  - id: G-07
    name: live replacement-model call
    blocking: false
    fail_closed: true
    command: demo/egaki/live_image_check.sh <out.png> gemini-3.1-flash-image-preview
    expect: |
      exit 0; output file exists, is non-empty, and its magic bytes parse as
      PNG or JPEG.
    baseline_result: |
      BLOCKED — not a PASS. Two independent credential problems, both measured:

      1. AI Studio path (GOOGLE_GENERATIVE_AI_API_KEY from
         .secrets/gemini_api_key.txt): the request reached the Gemini API and
         was rejected with RESOURCE_EXHAUSTED, "Your prepayment credits are
         depleted", after 3 retries. Routing works; billing does not.
      2. Vertex path: the pinned CLI gates Vertex behind GOOGLE_VERTEX_API_KEY
         (models.ts:198-204, "Vertex models require a direct Google Cloud API
         key"). It does not read Application Default Credentials, so the
         project's service-account JSON cannot satisfy it — even though
         Vertex itself works for this project on the `global` endpoint.

      Unblock with either AI Studio credits or a Vertex express API key.
    rule: |
      A blocked live call is recorded as BLOCKED and never as PASS. If the
      migration's whole point is that the replacement model works, shipping a PR
      without this evidence requires an explicit HUMAN_REQUIRED marker in the
      run state.

  - id: G-08
    name: policy and scope
    blocking: true
    check: |
      No edits under .github/workflows/, infra/, or any other forbidden path;
      no merge, deploy, or branch-protection action attempted.
    cross_reference: demo/adversarial/

# ── what a green build does not prove ─────────────────────────────────────
known_blind_spots:
  - id: B-01
    gap: |
      G-04 and G-05 both pass on a patch that drops `--seed`, `-n`, `--mask`,
      and `--negative-prompt` support, because moving a model from the 'image'
      strategy to the 'text' strategy changes runtime behavior without changing
      any type.
    mitigation: |
      Capability deltas (expected-findings.yaml F-05) are asserted separately
      and must be disclosed in the PR body. Verification is not allowed to
      report PASS on build+test alone.
  - id: B-02
    gap: |
      No test in the pinned suite exercises a real Google image generation, so
      the suite cannot detect a wrong provider path.
    mitigation: G-07, and its BLOCKED status is surfaced rather than hidden.
  - id: B-03
    gap: Documentation correctness is unverifiable by tests.
    mitigation: Reviewer checklist in demo-script.md; docs findings are F-08.

verdicts:
  PASS: all blocking gates pass and G-07 passes
  HUMAN_REQUIRED: all blocking gates pass but G-07 is BLOCKED, or any capability delta is unresolved
  FAIL: any blocking gate fails
  INCONCLUSIVE: a gate could not be executed — never collapses to PASS
