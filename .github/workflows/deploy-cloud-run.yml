# Apply pending migrations, then deploy the dashboard and the wired control plane
# to named Cloud Run services on every push to main. The service names are the
# URL: do not rename `patchapi-web` or `patchapi-api` or the links change.
#
# The `migrate` job gates every other job. Read its comment before adding a job
# here or a migration under db/migrations/.
#
# One-time GCP bootstrap (WIF, Artifact Registry, reserved services):
#   ./scripts/bootstrap_cloud_run.sh
name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: patch-505223
  PROJECT_NUMBER: "913371146929"
  REGION: us-central1
  AR_REPO: patchapi
  WEB_SERVICE: patchapi-web
  API_SERVICE: patchapi-api
  INDEXER_SERVICE: patchapi-indexer
  AGENTS_SERVICE: patchapi-agents
  GHTOOLS_SERVICE: patchapi-github-tools
  # Vertex AI Agent Engine holding institutional context across weeks. An opaque
  # numeric id, so it is configuration rather than anything derivable; the agent
  # lane falls back to a local file when this is unset, which is why an empty
  # value degrades a deploy quietly instead of failing it.
  MEMORY_BANK_ENGINE: "6770363244553961472"
  # The poll behind both Cloud Scheduler and the console's "Check now" button.
  REFRESH_JOB: patchapi-refresh-releases
  # One remediation, started by the console's "Start remediation" button. A job
  # rather than a request because it runs for minutes. Kept deployed for
  # replaying a single run by hand; the console prefers the warm pool below.
  REMEDIATION_JOB: patchapi-remediate
  # Always-on instances that claim RECEIVED runs. Created by
  # scripts/bootstrap_remediation_worker.sh. A job execution waited 136s for
  # Cloud Run to find capacity and paid it again on Continue; a warm instance
  # claims the run on its next poll.
  REMEDIATION_WORKER_POOL: patchapi-remediate-worker
  # How many remediations the deployment performs at once. A worker performs one
  # run at a time and worker pools do not autoscale, so this number is the
  # concurrency. Set on every deploy rather than only at bootstrap: it is a
  # property of the code being deployed, and leaving it to whatever created the
  # pool is how the deployment sat at one instance while the console reported the
  # second of two runs as having nobody to claim it. Raised together with
  # `replicas` in sandbox/gke/warm-pool.yaml, which is two per concurrent run.
  REMEDIATION_WORKER_INSTANCES: 2
  # Created by scripts/bootstrap_remediation_job.sh. Narrower than
  # roles/run.developer, which is the only predefined role carrying the
  # `runWithOverrides` permission a run id needs.
  REMEDIATION_INVOKER_ROLE: patchapiRemediationInvoker
  # The job's own identity. The control plane grants it read access on each
  # project secret it creates, because the job is what needs the value.
  REMEDIATION_SA: patchapi-remediate@patch-505223.iam.gserviceaccount.com
  WEB_SA: patchapi-web@patch-505223.iam.gserviceaccount.com
  API_SA: patchapi-api@patch-505223.iam.gserviceaccount.com
  INDEXER_SA: patchapi-indexer@patch-505223.iam.gserviceaccount.com
  AGENTS_SA: patchapi-agents@patch-505223.iam.gserviceaccount.com
  GHTOOLS_SA: patchapi-github-tools@patch-505223.iam.gserviceaccount.com
  # Stable Cloud Run URLs (name + project number + region). Confirmed by
  # scripts/bootstrap_cloud_run.sh; changing any of the three changes the URL.
  WEB_URL: https://patchapi-web-913371146929.us-central1.run.app
  API_URL: https://patchapi-api-913371146929.us-central1.run.app
  INDEXER_URL: https://patchapi-indexer-uhkx74fgmq-uc.a.run.app
  WEB_URL_CLASSIC: https://patchapi-web-uhkx74fgmq-uc.a.run.app

jobs:
  # Every other job needs this one, so nothing is repointed at a new image until
  # the schema that image expects is in place. Without this gate a commit that
  # added a migration and the code reading it deployed the code alone, and the
  # next remediation failed on a column that did not exist — after it had already
  # opened its pull request.
  #
  # Correct only while migrations stay additive. The previous image keeps serving
  # for the length of the rollout, so a migration that drops or renames breaks
  # it; db/README.md states that rule where a migration gets written.
  migrate:
    name: schema
    runs-on: ubuntu-latest
    outputs:
      # Whether the deployment has a database at all. Decided once here instead
      # of by each job in turn, so the services that need a DSN and the services
      # that do not can disagree about it without disagreeing about the answer.
      ready: ${{ steps.dsn.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # The DSN lands in a runner-local file rather than a step output or
      # GITHUB_ENV: it is a credential, and only the boolean derived from it is
      # allowed to travel between jobs.
      - name: Read the database DSN
        id: dsn
        run: |
          install -d -m 700 "${RUNNER_TEMP}/db"
          umask 077
          gcloud secrets versions access latest \
            --secret=patchapi-database-url \
            --project="${PROJECT_ID}" >"${RUNNER_TEMP}/db/dsn" 2>/dev/null || true
          if grep -q '^postgres' "${RUNNER_TEMP}/db/dsn" 2>/dev/null; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            rm -f "${RUNNER_TEMP}/db/dsn"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "patchapi-database-url is not a Postgres DSN yet;" \
                 "skipping migrations and every service that needs one."
          fi

      # Reached through the Cloud SQL Auth Proxy because the runner is not on the
      # instance's VPC — widening the instance's own network exposure to spare a
      # binary is not the trade. `--unix-socket /cloudsql` is the path Cloud Run
      # mounts, which is what lets the secret be used exactly as stored: nothing
      # here parses or rebuilds a DSN, so there is no host or port for a log line
      # to leak or for this job to get wrong.
      - name: Apply pending migrations
        if: steps.dsn.outputs.ready == 'true'
        env:
          CLOUDSQL_INSTANCE: patch-505223:us-central1:patchapi-console
          PROXY_VERSION: v2.15.2
        run: |
          socket_dir="/cloudsql/${CLOUDSQL_INSTANCE}"

          # The runner image ships a psql client and the migration runner shells
          # out to one. Installed here only for the day that stops being true.
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          curl -fsSL -o /tmp/cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x /tmp/cloud-sql-proxy
          sudo install -d -o "$(id -u)" -g "$(id -g)" /cloudsql

          /tmp/cloud-sql-proxy "${CLOUDSQL_INSTANCE}" --unix-socket /cloudsql &
          proxy=$!
          trap 'kill "${proxy}" 2>/dev/null || true' EXIT
          for _ in $(seq 30); do
            if [[ -S "${socket_dir}/.s.PGSQL.5432" ]]; then break; fi
            sleep 1
          done
          if [[ ! -S "${socket_dir}/.s.PGSQL.5432" ]]; then
            echo "the Cloud SQL Auth Proxy did not open a socket at ${socket_dir}" >&2
            exit 1
          fi

          # `patchapi-db` is standard library only, so PYTHONPATH is the entire
          # install and a failure here cannot be dependency resolution. `migrate`
          # applies each pending migration once and is a no-op on an unchanged
          # tree; `status` then exits non-zero if anything is still pending, so a
          # runner that somehow half-applied the ledger fails this job rather
          # than letting the images past it.
          DATABASE_URL="$(cat "${RUNNER_TEMP}/db/dsn")"
          export DATABASE_URL
          export PYTHONPATH=db/src
          python3 -m patchapi_db migrate
          python3 -m patchapi_db status

  web:
    name: patchapi-web
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push dashboard
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/web:${{ github.sha }}
        run: |
          FIREBASE_API_KEY="$(gcloud secrets versions access latest --secret=patchapi-identity-api-key)"
          docker build \
            -f apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_URL=${API_URL}" \
            --build-arg "PATCHAPI_API_URL=${API_URL}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=patch-505223.firebaseapp.com" \
            -t "${IMAGE}" \
            apps/web
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy dashboard
        run: |
          gcloud run deploy "${WEB_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${WEB_SA}" \
            --allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="NODE_ENV=production,PATCHAPI_API_URL=${API_URL},NEXT_PUBLIC_API_URL=${API_URL}"

  api:
    name: patchapi-api
    runs-on: ubuntu-latest
    # No DSN means no control plane: the reserved service stays as it is.
    needs: migrate
    if: needs.migrate.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push control plane
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }}
        run: |
          docker build -f services/control_api/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy control plane
        run: |
          gcloud run deploy "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${API_SA}" \
            --allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="^|^GCP_PROJECT=${PROJECT_ID}|GCP_REGION=${REGION}|PATCHAPI_REFRESH_JOB=${REFRESH_JOB}|PATCHAPI_REMEDIATION_JOB=${REMEDIATION_JOB}|PATCHAPI_REMEDIATION_WORKER_POOL=${REMEDIATION_WORKER_POOL}|PATCHAPI_SECRET_READER_ACCOUNTS=${REMEDIATION_SA}|PATCHAPI_EVIDENCE_BASE_URL=${API_URL}|PATCHAPI_PUBSUB_TOPIC_PREFIX=patchapi-dev|PATCHAPI_ENV=cloud|PATCHAPI_DB_POOL_MIN=1|PATCHAPI_DB_POOL_MAX=3|PATCHAPI_FRONTEND_ORIGIN=${WEB_URL}|PATCHAPI_CORS_ORIGINS=${WEB_URL},${WEB_URL_CLASSIC}|PATCHAPI_GOOGLE_OAUTH_REDIRECT_URI=${API_URL}/api/auth/google/callback|PATCHAPI_GITHUB_OAUTH_REDIRECT_URI=${API_URL}/api/auth/github/callback|PATCHAPI_COOKIE_SECURE=1|PATCHAPI_IDENTITY_ACTION_URL=${WEB_URL}/auth/action|GITHUB_APP_SLUG=patchapi|GITHUB_APP_PRIVATE_KEY_PATH=/var/github/app.pem|PATCHAPI_GITHUB_APP=/var/github-json/app.json" \
            --add-cloudsql-instances=patch-505223:us-central1:patchapi-console \
            --set-secrets="DATABASE_URL=patchapi-database-url:latest,PATCHAPI_SESSION_SECRET=patchapi-session-secret:latest,PATCHAPI_IDENTITY_API_KEY=patchapi-identity-api-key:latest,PATCHAPI_GOOGLE_OAUTH_CLIENT_ID=patchapi-google-oauth-client-id:latest,PATCHAPI_GOOGLE_OAUTH_CLIENT_SECRET=patchapi-google-oauth-client-secret:latest,PATCHAPI_GITHUB_WEBHOOK_SECRET=patchapi-github-webhook-secret:latest,PATCHAPI_GITHUB_OAUTH_CLIENT_ID=patchapi-github-oauth-client-id:latest,PATCHAPI_GITHUB_OAUTH_CLIENT_SECRET=patchapi-github-oauth-client-secret:latest,GITHUB_APP_ID=patchapi-github-app-id:latest,/var/github/app.pem=patchapi-github-app-private-key:latest,/var/github-json/app.json=patchapi-github-app:latest"

      # The job runs the same image as the service — `patchapi-refresh-releases`
      # is an entry point in the same wheel — so it has to move with it. Left
      # out, the job stays pinned to whatever image created it and drifts a
      # schema migration behind the code, which is silent until the first
      # scheduled run fails against a table the migration renamed.
      - name: Deploy release refresh job
        run: |
          gcloud run jobs update "${REFRESH_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}"

  indexer:
    name: patchapi-indexer
    runs-on: ubuntu-latest
    needs: migrate
    if: needs.migrate.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push indexer
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/indexer:${{ github.sha }}
        run: |
          docker build -f services/repo_indexer/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy indexer
        run: |
          gcloud run deploy "${INDEXER_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${INDEXER_SA}" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=2Gi \
            --cpu=2 \
            --timeout=900 \
            --concurrency=4 \
            --min-instances=0 \
            --max-instances=4 \
            --set-env-vars="^|^GCP_PROJECT=${PROJECT_ID}|PATCHAPI_PUBSUB_TOPIC_PREFIX=patchapi-dev|PATCHAPI_ENV=cloud|PATCHAPI_INDEX_BACKEND=zoekt|GITHUB_APP_PRIVATE_KEY_PATH=/var/github/app.pem" \
            --add-cloudsql-instances=patch-505223:us-central1:patchapi-console \
            --set-secrets="DATABASE_URL=patchapi-database-url:latest,GITHUB_APP_ID=patchapi-github-app-id:latest,/var/github/app.pem=patchapi-github-app-private-key:latest"
          gcloud run services add-iam-policy-binding "${INDEXER_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --member="serviceAccount:patchapi-pubsub-push@patch-505223.iam.gserviceaccount.com" \
            --role="roles/run.invoker" \
            --quiet
          for event in repo-push project-repo-added project-repo-removed provider-change-detected; do
            gcloud pubsub subscriptions update "patchapi-dev-${event}-sub" \
              --project="${PROJECT_ID}" \
              --push-endpoint="${INDEXER_URL}/v1/events" \
              --push-auth-service-account="patchapi-pubsub-push@patch-505223.iam.gserviceaccount.com" \
              --ack-deadline=600 \
              --quiet
          done

  agents:
    name: patchapi-agents
    runs-on: ubuntu-latest
    needs: migrate
    if: needs.migrate.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      # `run worker-pools` is only on the beta track, and an uninstalled
      # component makes `gcloud beta` prompt rather than fail — which, behind the
      # `>/dev/null 2>&1` guard below, reported the pool as not existing and left
      # the remediator on a stale image while the deploy went green.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the agent lane
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/agents:${{ github.sha }}
        run: |
          docker build -f services/agent_runner/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy the agent lane
        run: |
          # A turn calls the model, the liveness check, and web search, so one
          # request is minutes rather than milliseconds: concurrency 1 and a long
          # timeout, matched by the subscription's ack deadline.
          gcloud run deploy "${AGENTS_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${AGENTS_SA}" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=2Gi \
            --cpu=2 \
            --timeout=600 \
            --concurrency=1 \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="^|^GCP_PROJECT=${PROJECT_ID}|GCP_VERTEX_LOCATION=global|PATCHAPI_ENV=cloud|PATCHAPI_REPO_ROOT=/app|PATCHAPI_FEED_DIR=/app/demo/fixtures|PATCHAPI_MEMORY_BANK_ENGINE=${MEMORY_BANK_ENGINE}|PATCHAPI_MEMORY_BANK_LOCATION=${REGION}" \
            --add-cloudsql-instances=patch-505223:us-central1:patchapi-console \
            --set-secrets="DATABASE_URL=patchapi-database-url:latest,GOOGLE_API_KEY=patchapi-gemini-api-key:latest"
          AGENTS_URL="$(gcloud run services describe "${AGENTS_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          gcloud run services add-iam-policy-binding "${AGENTS_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --member="serviceAccount:patchapi-pubsub-push@patch-505223.iam.gserviceaccount.com" \
            --role="roles/run.invoker" \
            --quiet
          gcloud pubsub subscriptions update patchapi-dev-change-normalized-sub \
            --project="${PROJECT_ID}" \
            --push-endpoint="${AGENTS_URL}/v1/events" \
            --push-auth-service-account="patchapi-pubsub-push@patch-505223.iam.gserviceaccount.com" \
            --ack-deadline=600 \
            --quiet

      # The remediation job runs the same image under a different entry point.
      # Repointed here so a deploy cannot leave the console starting yesterday's
      # patch loop while the services are on today's.
      - name: Repoint the remediation job
        run: |
          if gcloud run jobs describe "${REMEDIATION_JOB}" \
               --project="${PROJECT_ID}" --region="${REGION}" >/dev/null 2>&1; then
            gcloud run jobs update "${REMEDIATION_JOB}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --image="${IMAGE}" \
              --update-env-vars="^|^PATCHAPI_MEMORY_BANK_ENGINE=${MEMORY_BANK_ENGINE}|PATCHAPI_MEMORY_BANK_LOCATION=${REGION}"
            # Reasserted rather than left to the one-time bootstrap. Without it
            # the console's Start remediation answers 403 from Cloud Run, which
            # reads to an operator as the product being broken. The role is the
            # narrow one scripts/bootstrap_remediation_job.sh defines: starting
            # this job with a run id, and nothing else Cloud Run holds.
            gcloud run jobs add-iam-policy-binding "${REMEDIATION_JOB}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --member="serviceAccount:${API_SA}" \
              --role="projects/${PROJECT_ID}/roles/${REMEDIATION_INVOKER_ROLE}" \
              --quiet >/dev/null
          else
            echo "job ${REMEDIATION_JOB} does not exist yet;" \
                 "run scripts/bootstrap_remediation_job.sh once"
          fi

      # The lane that actually performs runs. Repointed for the same reason as
      # the job, and more urgently: an instance here is long-lived, so without
      # this it would keep serving the old image until something restarted it.
      - name: Repoint the remediation worker pool
        run: |
          # Any failure other than "no such pool" fails the deploy. Treating them
          # all as absence is how a green deploy left the remediator running an
          # image from before the change it was deploying.
          if reason="$(gcloud beta run worker-pools describe "${REMEDIATION_WORKER_POOL}" \
               --project="${PROJECT_ID}" --region="${REGION}" --format='value(name)' 2>&1)"; then
            gcloud beta run worker-pools update "${REMEDIATION_WORKER_POOL}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --image="${IMAGE}" \
              --scaling="${REMEDIATION_WORKER_INSTANCES}" \
              --update-env-vars="^|^PATCHAPI_MEMORY_BANK_ENGINE=${MEMORY_BANK_ENGINE}|PATCHAPI_MEMORY_BANK_LOCATION=${REGION}" \
              --quiet
          elif printf '%s' "${reason}" | grep -qiE 'NOT_FOUND|could not be found|does not exist'; then
            echo "worker pool ${REMEDIATION_WORKER_POOL} does not exist yet;" \
                 "run scripts/bootstrap_remediation_worker.sh once"
          else
            echo "cannot read worker pool ${REMEDIATION_WORKER_POOL}: ${reason}" >&2
            exit 1
          fi

  github-tools:
    name: patchapi-github-tools
    runs-on: ubuntu-latest
    # Holds no DSN, but still waits: a failed migration deploys nothing.
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the GitHub capability adapter
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/github-tools:${{ github.sha }}
        run: |
          docker build -f services/github_tools/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy the GitHub capability adapter
        run: |
          # No database and no Pub/Sub: this service holds the App private key,
          # so it is reachable only over Cloud Run IAM and knows nothing else.
          # Identity and invoker grants come from scripts/bootstrap_github_tools.sh.
          gcloud run deploy "${GHTOOLS_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${GHTOOLS_SA}" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=120 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="PATCHAPI_ENV=cloud,GITHUB_APP_PRIVATE_KEY_PATH=/var/github/app.pem" \
            --set-secrets="GITHUB_APP_ID=patchapi-github-app-id:latest,GITHUB_APP_INSTALLATION_ID=patchapi-github-app-installation-id:latest,/var/github/app.pem=patchapi-github-app-private-key:latest"
