# Deploy the dashboard and the wired control plane to named Cloud Run
# services on every push to main. The service names are the URL: do not
# rename `patchapi-web` or `patchapi-api` or the links change.
#
# One-time GCP bootstrap (WIF, Artifact Registry, reserved services):
#   ./scripts/bootstrap_cloud_run.sh
name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: patch-505223
  PROJECT_NUMBER: "913371146929"
  REGION: us-central1
  AR_REPO: patchapi
  WEB_SERVICE: patchapi-web
  API_SERVICE: patchapi-api
  INDEXER_SERVICE: patchapi-indexer
  AGENTS_SERVICE: patchapi-agents
  GHTOOLS_SERVICE: patchapi-github-tools
  WEB_SA: patchapi-web@patch-505223.iam.gserviceaccount.com
  API_SA: patchapi-api@patch-505223.iam.gserviceaccount.com
  INDEXER_SA: patchapi-indexer@patch-505223.iam.gserviceaccount.com
  AGENTS_SA: patchapi-agents@patch-505223.iam.gserviceaccount.com
  GHTOOLS_SA: patchapi-github-tools@patch-505223.iam.gserviceaccount.com
  # Stable Cloud Run URLs (name + project number + region). Confirmed by
  # scripts/bootstrap_cloud_run.sh; changing any of the three changes the URL.
  WEB_URL: https://patchapi-web-913371146929.us-central1.run.app
  API_URL: https://patchapi-api-913371146929.us-central1.run.app
  INDEXER_URL: https://patchapi-indexer-uhkx74fgmq-uc.a.run.app
  WEB_URL_CLASSIC: https://patchapi-web-uhkx74fgmq-uc.a.run.app

jobs:
  web:
    name: patchapi-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push dashboard
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/web:${{ github.sha }}
        run: |
          FIREBASE_API_KEY="$(gcloud secrets versions access latest --secret=patchapi-identity-api-key)"
          docker build \
            -f apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_URL=${API_URL}" \
            --build-arg "PATCHAPI_API_URL=${API_URL}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=patch-505223.firebaseapp.com" \
            -t "${IMAGE}" \
            apps/web
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy dashboard
        run: |
          gcloud run deploy "${WEB_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${WEB_SA}" \
            --allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="NODE_ENV=production,PATCHAPI_API_URL=${API_URL},NEXT_PUBLIC_API_URL=${API_URL}"

  api:
    name: patchapi-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Skip until DATABASE_URL is a real DSN
        id: db
        run: |
          dsn="$(gcloud secrets versions access latest --secret=patchapi-database-url 2>/dev/null || true)"
          if printf '%s' "${dsn}" | grep -q '^postgres'; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "patchapi-database-url is not a Postgres DSN yet; leaving the reserved API service in place."
          fi

      - name: Auth Docker to Artifact Registry
        if: steps.db.outputs.ready == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push control plane
        if: steps.db.outputs.ready == 'true'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }}
        run: |
          docker build -f services/control_api/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy control plane
        if: steps.db.outputs.ready == 'true'
        run: |
          gcloud run deploy "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${API_SA}" \
            --allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="^|^GCP_PROJECT=${PROJECT_ID}|PATCHAPI_PUBSUB_TOPIC_PREFIX=patchapi-dev|PATCHAPI_ENV=cloud|PATCHAPI_DB_POOL_MIN=1|PATCHAPI_DB_POOL_MAX=3|PATCHAPI_FRONTEND_ORIGIN=${WEB_URL}|PATCHAPI_CORS_ORIGINS=${WEB_URL},${WEB_URL_CLASSIC}|PATCHAPI_GOOGLE_OAUTH_REDIRECT_URI=${API_URL}/api/auth/google/callback|PATCHAPI_GITHUB_OAUTH_REDIRECT_URI=${API_URL}/api/auth/github/callback|PATCHAPI_COOKIE_SECURE=1|PATCHAPI_IDENTITY_ACTION_URL=${WEB_URL}/auth/action|GITHUB_APP_SLUG=patchapi|GITHUB_APP_PRIVATE_KEY_PATH=/var/github/app.pem|PATCHAPI_GITHUB_APP=/var/github-json/app.json" \
            --add-cloudsql-instances=patch-505223:us-central1:patchapi-console \
            --set-secrets="DATABASE_URL=patchapi-database-url:latest,PATCHAPI_SESSION_SECRET=patchapi-session-secret:latest,PATCHAPI_IDENTITY_API_KEY=patchapi-identity-api-key:latest,PATCHAPI_GOOGLE_OAUTH_CLIENT_ID=patchapi-google-oauth-client-id:latest,PATCHAPI_GOOGLE_OAUTH_CLIENT_SECRET=patchapi-google-oauth-client-secret:latest,PATCHAPI_GITHUB_WEBHOOK_SECRET=patchapi-github-webhook-secret:latest,PATCHAPI_GITHUB_OAUTH_CLIENT_ID=patchapi-github-oauth-client-id:latest,PATCHAPI_GITHUB_OAUTH_CLIENT_SECRET=patchapi-github-oauth-client-secret:latest,GITHUB_APP_ID=patchapi-github-app-id:latest,/var/github/app.pem=patchapi-github-app-private-key:latest,/var/github-json/app.json=patchapi-github-app:latest"

  indexer:
    name: patchapi-indexer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Skip until DATABASE_URL is a real DSN
        id: db
        run: |
          dsn="$(gcloud secrets versions access latest --secret=patchapi-database-url 2>/dev/null || true)"
          if printf '%s' "${dsn}" | grep -q '^postgres'; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Auth Docker to Artifact Registry
        if: steps.db.outputs.ready == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push indexer
        if: steps.db.outputs.ready == 'true'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/indexer:${{ github.sha }}
        run: |
          docker build -f services/repo_indexer/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy indexer
        if: steps.db.outputs.ready == 'true'
        run: |
          gcloud run deploy "${INDEXER_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${INDEXER_SA}" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=2Gi \
            --cpu=2 \
            --timeout=900 \
            --concurrency=4 \
            --min-instances=0 \
            --max-instances=4 \
            --set-env-vars="^|^GCP_PROJECT=${PROJECT_ID}|PATCHAPI_PUBSUB_TOPIC_PREFIX=patchapi-dev|PATCHAPI_ENV=cloud|PATCHAPI_INDEX_BACKEND=zoekt|GITHUB_APP_PRIVATE_KEY_PATH=/var/github/app.pem" \
            --add-cloudsql-instances=patch-505223:us-central1:patchapi-console \
            --set-secrets="DATABASE_URL=patchapi-database-url:latest,GITHUB_APP_ID=patchapi-github-app-id:latest,/var/github/app.pem=patchapi-github-app-private-key:latest"
          gcloud run services add-iam-policy-binding "${INDEXER_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --member="serviceAccount:patchapi-pubsub-push@patch-505223.iam.gserviceaccount.com" \
            --role="roles/run.invoker" \
            --quiet
          for event in repo-push project-repo-added project-repo-removed provider-change-detected; do
            gcloud pubsub subscriptions update "patchapi-dev-${event}-sub" \
              --project="${PROJECT_ID}" \
              --push-endpoint="${INDEXER_URL}/v1/events" \
              --push-auth-service-account="patchapi-pubsub-push@patch-505223.iam.gserviceaccount.com" \
              --ack-deadline=600 \
              --quiet
          done

  agents:
    name: patchapi-agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Skip until DATABASE_URL is a real DSN
        id: db
        run: |
          dsn="$(gcloud secrets versions access latest --secret=patchapi-database-url 2>/dev/null || true)"
          if printf '%s' "${dsn}" | grep -q '^postgres'; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Auth Docker to Artifact Registry
        if: steps.db.outputs.ready == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the agent lane
        if: steps.db.outputs.ready == 'true'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/agents:${{ github.sha }}
        run: |
          docker build -f services/agent_runner/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy the agent lane
        if: steps.db.outputs.ready == 'true'
        run: |
          # A turn calls the model, the probe, and web search, so one request is
          # minutes rather than milliseconds: concurrency 1 and a long timeout,
          # matched by the subscription's ack deadline.
          gcloud run deploy "${AGENTS_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${AGENTS_SA}" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=2Gi \
            --cpu=2 \
            --timeout=600 \
            --concurrency=1 \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="^|^GCP_PROJECT=${PROJECT_ID}|GCP_VERTEX_LOCATION=global|PATCHAPI_ENV=cloud|PATCHAPI_REPO_ROOT=/app|PATCHAPI_FEED_DIR=/app/demo/fixtures" \
            --add-cloudsql-instances=patch-505223:us-central1:patchapi-console \
            --set-secrets="DATABASE_URL=patchapi-database-url:latest,GOOGLE_API_KEY=patchapi-gemini-api-key:latest"
          AGENTS_URL="$(gcloud run services describe "${AGENTS_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          gcloud run services add-iam-policy-binding "${AGENTS_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --member="serviceAccount:patchapi-pubsub-push@patch-505223.iam.gserviceaccount.com" \
            --role="roles/run.invoker" \
            --quiet
          gcloud pubsub subscriptions update patchapi-dev-change-normalized-sub \
            --project="${PROJECT_ID}" \
            --push-endpoint="${AGENTS_URL}/v1/events" \
            --push-auth-service-account="patchapi-pubsub-push@patch-505223.iam.gserviceaccount.com" \
            --ack-deadline=600 \
            --quiet

  github-tools:
    name: patchapi-github-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/913371146929/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: patchapi-github-deploy@patch-505223.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the GitHub capability adapter
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/github-tools:${{ github.sha }}
        run: |
          docker build -f services/github_tools/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy the GitHub capability adapter
        run: |
          # No database and no Pub/Sub: this service holds the App private key,
          # so it is reachable only over Cloud Run IAM and knows nothing else.
          # Identity and invoker grants come from scripts/bootstrap_github_tools.sh.
          gcloud run deploy "${GHTOOLS_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${GHTOOLS_SA}" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=120 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="PATCHAPI_ENV=cloud,GITHUB_APP_PRIVATE_KEY_PATH=/var/github/app.pem" \
            --set-secrets="GITHUB_APP_ID=patchapi-github-app-id:latest,GITHUB_APP_INSTALLATION_ID=patchapi-github-app-installation-id:latest,/var/github/app.pem=patchapi-github-app-private-key:latest"
