# Identity for sandbox pods. It holds no RoleBinding and no Workload Identity
# annotation, so a process inside the sandbox cannot reach the Kubernetes API
# or any Google Cloud API through the pod identity (roadmap §13.4).
#
# automountServiceAccountToken is refused here as well as in the SandboxTemplate
# so a pod created directly against this account still gets no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchapi-sandbox-runner
  namespace: patchapi-sandbox-dev
  labels:
    app.kubernetes.io/part-of: patchapi
    app.kubernetes.io/component: agent-sandbox
automountServiceAccountToken: false
