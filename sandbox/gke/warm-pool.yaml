# Pre-provisioned sandboxes (roadmap §13.5). Sandbox creation and the first
# pnpm install dominate end-to-end latency, so the demo path allocates from a
# pool that is already scheduled on a gVisor node.
#
# Kept at one replica: a warm sandbox holds its CPU/memory reservation for as
# long as it exists, and the demo verifies one repository at a time.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: patchapi-node22-warm
  namespace: patchapi-sandbox-dev
  labels:
    app.kubernetes.io/part-of: patchapi
    app.kubernetes.io/component: agent-sandbox
spec:
  replicas: 1
  # A pooled sandbox inherits the full template posture; warming changes when a
  # sandbox is created, never what it is allowed to do.
  sandboxTemplateRef:
    name: patchapi-node22
